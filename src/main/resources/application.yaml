spring:
  application:
    name: SimpleWeibo-backend

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# Springdoc OpenAPI 文档
springdoc:
  api-docs:
    path: /v3/api-docs

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh-CN

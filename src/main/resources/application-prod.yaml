# 生产环境配置
# 敏感信息通过环境变量注入, 未设置时使用冒号后的默认值
# 启动方式: SPRING_PROFILES_ACTIVE=prod java -jar SimpleWeibo-backend-0.0.1-SNAPSHOT.jar

server:
  port: 8123

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:simple_weibo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 生产环境必须通过环境变量设置真实密码
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: simpleweibo-prod
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      max-poll-records: 500

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不输出 SQL 日志

logging:
  level:
    root: info
    org.example.simpleweibobackend: info

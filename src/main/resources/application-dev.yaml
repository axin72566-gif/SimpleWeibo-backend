server:
  port: 8123

spring:
  datasource:
    url: jdbc:mysql://localhost:3305/simple_weibo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      pool-name: simpleweibo-dev
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000  # 获取连接超时3秒，与Redis max-wait一致，快速失败
      max-lifetime: 1800000     # 30分钟，需低于MySQL wait_timeout（默认8小时）

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
          max-retries: 3
        default-requeue-rejected: false
        concurrency: 1
        prefetch: 5

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
